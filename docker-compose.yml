services:
  # The PostgreSQL Database
  db:
    image: postgres:15
    container_name: fastapi_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rabbitpodo
      POSTGRES_DB: fastapi_db
    ports:
      # Mapping host port 5433 to container port 5432 
      # (This avoids clashing with your existing postgres container!)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # PgAdmin: A visual web UI to manage your PostgreSQL database (Optional but highly recommended)
  pgadmin:
    image: dpage/pgadmin4
    container_name: fastapi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db

  minio:
    image: minio/minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web UI Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  # This makes sure your database data isn't deleted when the container shuts down
  postgres_data:
  minio_data: